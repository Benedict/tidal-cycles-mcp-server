name: Release

# Publishes to npm, and creates a GitHub release with the Claude Desktop
# bundle (.mcpb) attached, when a version tag (e.g. v1.1.0) is pushed.
#
# Authentication, in the order npm tries them:
#   1. Trusted publishing: on npmjs.com, add this repo and release.yml as a
#      trusted publisher for the package. No secret needed.
#   2. An NPM_TOKEN repository secret with publish rights.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'

    - name: Check the tag matches package.json
      run: |
        version="v$(node -p "require('./package.json').version")"
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
          exit 1
        fi

    # Trusted publishing needs npm 11.5.1 or later
    - name: Update npm
      run: npm install -g npm@latest

    - name: Install dependencies
      run: npm ci

    # prepublishOnly builds and runs the tests first
    - name: Publish
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Build the bundle
      run: |
        npm ci
        npm run build
        npm run bundle

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" tidal-mcp-server.mcpb --title "$GITHUB_REF_NAME" --generate-notes
