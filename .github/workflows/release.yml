name: Release

# Publishes to npm when a version tag (e.g. v1.1.0) is pushed.
# Needs an NPM_TOKEN repository secret with publish rights.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: 'https://registry.npmjs.org'

    - name: Check the tag matches package.json
      run: |
        version="v$(node -p "require('./package.json').version")"
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
          exit 1
        fi

    - name: Install dependencies
      run: npm ci

    # prepublishOnly builds and runs the tests first
    - name: Publish
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
