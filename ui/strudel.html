<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal MCP · Strudel</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e2dfd6;
    --accent: #2d6a4f; --warn: #b42318; --code-bg: #f0eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141412; --panel: #1d1c1a; --ink: #edebe4; --muted: #9a978d; --line: #33322e;
      --accent: #74c69d; --warn: #f97066; --code-bg: #232220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .status { color: var(--muted); font-size: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--accent); }
  #start { margin: 20px 0; width: 100%; padding: 18px; font-size: 18px; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--accent); color: var(--bg); cursor: pointer; }
  #start[hidden] { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  pre { margin: 0; padding: 14px; background: var(--code-bg); border-radius: 8px; overflow-x: auto;
    font: 14px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  #error { color: var(--warn); }
  #error:empty { display: none; }
  p.note { color: var(--muted); font-size: 14px; margin: 16px 0 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Strudel</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span>
  </header>

  <button id="start" type="button">Start sound</button>

  <section class="panel">
    <h2>Playing</h2>
    <pre id="code">Nothing yet. Ask your MCP client to play something in Strudel.</pre>
    <p id="error"></p>
  </section>

  <p class="note">This page plays whatever the Tidal MCP server sends it, using <a href="https://strudel.cc">Strudel</a>.
    Anyone who opens it hears the same music on their own device.</p>
</main>

<script src="https://unpkg.com/@strudel/web@1.3.0"></script>
<!-- A module, so this page's names stay out of the global scope: Strudel puts
     its own functions there (it has a run, for one) and would overwrite ours. -->
<script type="module">
  const $ = (id) => document.getElementById(id);
  let lastError = null;

  // Strudel reports evaluation errors through onEvalError rather than throwing
  const ready = window.initStrudel({
    prebake: () => window.samples("github:tidalcycles/dirt-samples"),
    onEvalError: (error) => { lastError = error; },
  });

  $("start").addEventListener("click", () => { $("start").hidden = true; });

  let socket;
  let queue = Promise.resolve();

  function report(message) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  }

  async function run(id, code) {
    await ready;
    lastError = null;
    try {
      await window.evaluate(code);
    } catch (error) {
      lastError = error;
    }
    // Strudel keeps playing the previous program when one fails, so only show code that's playing
    if (!lastError) $("code").textContent = code;
    if (lastError) {
      const message = String(lastError.message || lastError);
      $("error").textContent = message;
      report({ type: "result", id, ok: false, error: message });
    } else {
      $("error").textContent = "";
      report({ type: "result", id, ok: true });
    }
  }

  let loaded = false;
  ready.then(() => {
    loaded = true;
    $("status").textContent = "Connected";
    report({ type: "ready" });
  });

  function connect() {
    socket = new WebSocket(`ws://${location.host}/strudel`);
    socket.onopen = () => {
      $("dot").classList.add("on");
      // Tell the server once Strudel and the samples have loaded, so it knows this page can answer quickly
      if (loaded) report({ type: "ready" });
      $("status").textContent = loaded ? "Connected" : "Connected, loading Strudel and samples…";
    };
    socket.onclose = () => {
      $("dot").classList.remove("on");
      $("status").textContent = "Disconnected, retrying…";
      setTimeout(connect, 2000);
    };
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.type === "program") {
        queue = queue.then(() => run(message.id, message.code));
      } else if (message.type === "hush") {
        queue = queue.then(async () => {
          await ready;
          window.hush();
          $("code").textContent = "Hushed.";
          $("error").textContent = "";
        });
      }
    };
  }
  connect();
</script>
</body>
</html>
